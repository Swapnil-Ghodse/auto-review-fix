[project]
name = "auto-review-fix"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Swapnil Ghodse", email = "sgaicommunity@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "gitpython>=3.2.1",
    "langchain>=1.5.0",
    "langgraph>=1.2.20",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "typer>=0.29.1",
]

[project.scripts]
auto-review-fix = "auto_review_fix:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "radon>=6.0.1",
    "ruff>=0.17.4",
]
